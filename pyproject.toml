[project]
name = "nezzontli-ctl"
version = "0.1.0"
description = "TUI para crear/editar contenido de Nezzontli (posts, páginas, álbumes de fotos)"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "pyfiglet>=1.0",
    "cowsay>=6.1",
    "textual-image>=0.8",
    "matplotlib>=3.8",
    "flatlatex>=0.15",
]

[project.scripts]
ctl = "nezzontli_ctl.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nezzontli_ctl"]
